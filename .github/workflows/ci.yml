name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-and-build:
    name: Lint, Static Type Check & Wheel Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --python 3.11

      - name: Ruff lint
        run: uv run ruff check src examples tests

      - name: Ruff format check
        run: uv run ruff format --check src examples tests

      - name: Mypy strict type check
        run: uv run mypy

      - name: Build sdist & wheel and verify py.typed in clean venv
        run: |
          uv build
          tmp_dir="$(mktemp -d)"
          uv venv --python 3.11 "$tmp_dir/venv"
          uv pip install --python "$tmp_dir/venv/bin/python" dist/*.whl
          (
            cd "$tmp_dir"
            "$tmp_dir/venv/bin/python" -c "
          import importlib.resources, cocotb_bfm
          assert (importlib.resources.files(cocotb_bfm) / 'py.typed').is_file()
          print('Installed wheel OK:', cocotb_bfm.__version__)
          "
          )

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run unit test suite
        run: uv run pytest -v tests/unit

  verilator-tests-and-examples:
    name: Verilator RTL Tests & Examples (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Verilator build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++

      - name: Set up Verilator 5.036
        uses: veryl-lang/setup-verilator@v2
        with:
          version: "5.036"

      - name: Check Verilator version
        run: verilator --version

      - name: Install dependencies (includes cocotb-bus)
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run Verilator RTL integration test suite
        run: uv run pytest -v -m rtl tests/rtl

      - name: Run beginner examples
        run: |
          uv run python examples/hello_valid_ready/run_example.py
          uv run python examples/sv_interface_and_reset/run_example.py
          uv run python examples/packed_struct_and_ooo/run_example.py

      - name: Run Avalon-MM CSR example
        run: uv run python examples/avalon_mm_csr/run_example.py

      - name: Run legacy cocotb-bus interop example
        run: uv run python examples/legacy_cocotb_bus_interop/run_example.py
